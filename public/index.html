.billing-main{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:3px 7px}
.billing-card h2{font-size:.82rem;color:var(--muted);letter-spacing:0}.billing-card .billing-main strong{color:var(--series,var(--ink));margin:3px 0 0;font-size:clamp(1.18rem,2vw,1.65rem);line-height:1.2}.billing-card .billing-main .pill{white-space:normal;font-size:.72rem}
.billing-parts{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:6px;font-size:.78rem}.billing-parts span{color:var(--series,var(--ink))}.billing-parts b{white-space:nowrap}
.billing-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}.billing-panel{min-width:0}.billing-panel h2{font-size:1.1rem;margin-bottom:6px}
.billing-legend{display:flex;flex-wrap:wrap;gap:5px 14px;justify-content:center;margin:12px 0 14px;color:var(--muted);font-size:.8rem}.billing-legend span{display:flex;align-items:center;gap:5px}.billing-legend i{width:14px;height:9px;border-radius:2px}
.billing-report .previous-bar{background:var(--old-bar)}.billing-report .multi-bar{background:linear-gradient(90deg,var(--billing-credit) 20%,var(--billing-debit) 20% 40%,var(--billing-cash) 40% 60%,var(--billing-pix) 60% 80%,var(--billing-fiado) 80%)}.billing-report .product-bar{background:var(--billing-product)}
.payment-chart{--plot-height:190px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px;margin-top:4px}
.payment-axis{height:var(--plot-height);display:flex;flex-direction:column;justify-content:space-between;text-align:right;color:var(--muted);font-size:.72rem;line-height:1;translate:0 -.35em}
.payment-bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;position:relative;isolation:isolate}.payment-bars::before{content:"";position:absolute;inset:0 0 auto;height:var(--plot-height);z-index:-1;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 25%)}
.payment-category{min-width:0;text-align:center}.payment-category>span{display:block;margin-top:5px;font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.payment-columns{height:var(--plot-height);display:flex;align-items:end;justify-content:center;gap:3px;padding-inline:3px}.payment-columns .chart-bar{display:block;width:42%;max-width:35px;border-radius:4px 4px 0 0;background:var(--series,var(--old-bar))}
.payment-values{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:13px 0 0;padding-top:9px;border-top:1px solid var(--line)}.payment-values dt{font-size:.78rem;font-weight:700;color:var(--series);display:flex;align-items:center;gap:4px}.payment-values dt i{width:7px;height:7px;border-radius:50%;background:var(--series);flex:none}.payment-values dd{margin:3px 0 0;overflow-wrap:anywhere}.payment-values strong{font-size:.82rem;color:var(--series)}.payment-values small{display:block;font-size:.71rem}
.product-chart{display:grid;gap:9px}.product-chart-row h3{font-size:.84rem;font-weight:700;letter-spacing:0}.product-chart-row p{color:var(--muted);font-size:.77rem}.product-chart-row p strong{color:var(--billing-product)}
.product-chart-bars{display:grid;gap:3px;margin:3px 0;min-height:19px}.product-chart-bars .chart-bar{height:8px;border-radius:0 4px 4px 0}
@media(max-width:820px){.billing-grid{grid-template-columns:1fr}}
@media(max-width:520px){.payment-chart{--plot-height:154px;gap:4px}.payment-axis{font-size:.65rem}.payment-category>span{font-size:.67rem}.payment-values{grid-template-columns:repeat(2,minmax(0,1fr))}.billing-main{display:block}.billing-main .pill{margin-top:4px}}
@media print{.print-only .billing-report{--ink:#0f172a;--muted:#334155;--line:#cbd5e1;--billing-credit:#1d4ed8;--billing-debit:#075985;--billing-cash:#047857;--billing-pix:#0f766e;--billing-fiado:#7e22ce;--billing-product:#b45309;print-color-adjust:exact;-webkit-print-color-adjust:exact}.print-only .billing-grid{grid-template-columns:1fr}.print-only .payment-values{grid-template-columns:repeat(5,minmax(0,1fr))}}

dialog.order-editor[data-order-step="1"]{width:490px}

.order-editor .editor-grid>.editor-section+.editor-section{border:0;margin:0;padding:0}
.order-editor .order-cart{padding:9px 10px;background:var(--soft);border:1px solid var(--line)}
.order-cart .count{font-size:.78rem}.order-cart #cart{max-height:clamp(114px,32dvh,250px);overflow:auto}
.order-cart #cart .itemline{padding:6px 2px}.order-cart #cart .empty{border:0;text-align:left;padding:9px 0;margin:0}
.order-editor .order-cart #cart .qty{width:3.6rem;min-height:37px}
.order-editor .order-jump{display:none}
.order-editor #order-checkout{display:grid;gap:8px}
@media(max-width:600px){.order-editor .editor-grid{gap:12px}.order-editor .order-jump{display:inline-flex;min-height:29px;padding:3px 7px}.order-cart #cart{max-height:clamp(106px,21dvh,170px)}.order-editor .product-scroll{max-height:clamp(114px,27dvh,210px)}}

html:has(.order-editor[open]){overflow:hidden}
.order-editor .dialog-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 14px}
.order-editor .dialog-head>button{grid-column:2;grid-row:1;justify-self:end}
.order-editor .order-customer-summary{min-width:0;grid-column:1/-1;padding:6px 10px;border-radius:8px;background:var(--soft)}
.order-customer-summary strong,.order-customer-summary small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-customer-summary strong{font-size:1rem}.order-customer-summary small{font-size:.82rem}
.order-editor .dialog-foot{grid-template-columns:minmax(0,1fr);justify-content:stretch}
.order-cart #cart .cart-item{display:grid;grid-template-columns:minmax(0,1fr) 3.6rem 38px;align-items:center;gap:8px}
.order-editor .order-cart #cart .qty{width:100%;padding-inline:7px;text-align:center}
.order-editor .order-cart #cart .cart-item .icononly{width:100%}
@media(min-width:601px){
  .order-editor[data-order-step="2"] .dialog-head{grid-template-columns:auto minmax(0,1fr) auto}
  .order-editor[data-order-step="2"] .dialog-head>button{grid-column:3}
  .order-editor .order-customer-summary{grid-column:2;grid-row:1;justify-self:center;max-width:100%;min-width:min(100%,210px)}
}
@media(min-width:900px){
  dialog.order-editor[data-order-step="2"]{width:calc(100vw - 48px);max-width:calc(100vw - 48px);height:calc(100dvh - 36px);max-height:calc(100dvh - 36px);overflow:hidden}
  .order-editor[data-order-step="2"]>form{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  .order-editor .dialog-head,.order-editor .dialog-foot{padding:12px 22px}
  .order-editor .dialog-body{padding:16px 22px;overflow:auto}
  .order-editor .order-customer-summary{min-width:min(100%,300px)}
  .order-editor #order-identification{max-width:740px;margin-inline:auto;padding-top:10px}
  .order-editor #order-items-step{min-height:100%;display:flex;flex-direction:column}
  .order-editor #order-items-step .editor-grid{flex:1;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:stretch}
  .order-editor .order-cart,.order-editor .order-catalog{display:flex;flex-direction:column;min-width:0}
  .order-editor .order-cart{padding:14px 16px}
  .order-editor .order-cart #cart{max-height:none;overflow:visible}
  .order-editor .product-scroll{max-height:none}
  .order-cart #cart .cart-item{grid-template-columns:minmax(0,1fr) 4.6rem 42px;gap:12px}
}
@media(min-width:1180px){
  .order-editor #order-checkout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:end}
  .order-editor .checkout-actions{border:0;padding:0}
  .order-editor .checkout-fields .payment-status .choices{min-height:43px}
}
@media(min-width:900px) and (min-height:520px){
  .order-editor #order-items-step{height:100%;min-height:0}
  .order-editor #order-items-step .editor-grid{min-height:0;grid-template-rows:minmax(0,1fr)}
  .order-editor .order-cart #cart,.order-editor .order-catalog .product-scroll{min-height:0;overflow:auto;scrollbar-gutter:stable;overscroll-behavior:contain}
}

.history-list .listrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-width:0}
.history-list .listrow>div{min-width:0}
.history-list .listrow .actions{display:grid;grid-template-columns:86px 70px;justify-content:end;grid-column:1/-1}
.history-list .listrow .actions>.btn{width:100%;padding-inline:7px}
@media(min-width:700px){
  .history-list .listrow{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.82fr) 164px;min-height:72px}
  .history-list .listrow .actions{grid-column:auto}
  .history-list .listrow p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

.chart-bar{display:block;border:0;margin:0;padding:0;min-width:0;min-height:0}
button.chart-bar:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.chart-bar:hover{filter:brightness(1.12)}
.chart-tooltip{position:fixed;z-index:8;pointer-events:none;max-width:min(320px,calc(100vw - 16px));padding:7px 10px;color:#f8fafc;background:#020617;border:1px solid #64748b;border-radius:7px;box-shadow:0 5px 16px #0206174d;font-size:.82rem;line-height:1.4;overflow-wrap:anywhere}
.chart-tooltip strong{display:block;margin-bottom:2px}
.chart-tooltip-value::before{content:"";display:inline-block;width:9px;height:9px;border:1px solid #cbd5e1;margin-right:6px;background:var(--swatch);vertical-align:baseline}

.stage-new{--stage-mark:#168151;--stage-ink:#105535;--stage-fill:#e2f6e9}
.stage-packing{--stage-mark:#b85a14;--stage-ink:#853708;--stage-fill:#fff0dc}
.stage-ready{--stage-mark:#7942ba;--stage-ink:#572790;--stage-fill:#f2e9ff}
.stage-route{--stage-mark:#2866ce;--stage-ink:#17498d;--stage-fill:#e6f0ff}
.stage-completed{--stage-mark:#536679;--stage-ink:#394f64;--stage-fill:#e9eef4}
.stage-cancelled{--stage-mark:#ba4251;--stage-ink:#891e30;--stage-fill:#ffe9ed}
[data-theme=dark] .stage-new{--stage-mark:#5ad39a;--stage-ink:#a9f2cf;--stage-fill:#183c32}
[data-theme=dark] .stage-packing{--stage-mark:#ffac63;--stage-ink:#ffd1a0;--stage-fill:#422d21}
[data-theme=dark] .stage-ready{--stage-mark:#c598fc;--stage-ink:#e5ceff;--stage-fill:#392957}
[data-theme=dark] .stage-route{--stage-mark:#80b3ff;--stage-ink:#c4dfff;--stage-fill:#21375e}
[data-theme=dark] .stage-completed{--stage-mark:#9fbbd0;--stage-ink:#d5e4f2;--stage-fill:#26374a}
[data-theme=dark] .stage-cancelled{--stage-mark:#f793a1;--stage-ink:#ffd0d7;--stage-fill:#4b2632}
.lane{padding:10px;background:color-mix(in srgb,var(--stage-fill) 56%,var(--surface));border-color:color-mix(in srgb,var(--stage-mark) 24%,var(--line))}
.lane .lane-title{padding:2px 2px 10px;color:var(--stage-ink);font-size:.94rem;letter-spacing:0}
.lane .lane-title .lane-label{display:flex;align-items:center;gap:8px}
.lane .lane-title .lane-icon{display:grid;place-items:center;width:31px;height:31px;flex:0 0 31px;background:var(--stage-fill);border-radius:9px;color:var(--stage-ink)}
.lane .lane-title .lane-icon .icon{width:17px;height:17px}
.lane .lane-title .count{border-color:color-mix(in srgb,var(--stage-mark) 28%,var(--line));background:var(--stage-fill);color:var(--stage-ink)}
.order{border-inline-start:4px solid var(--stage-mark);background:linear-gradient(155deg,color-mix(in srgb,var(--stage-fill) 44%,var(--surface)),var(--surface) 62%);padding:12px 12px 11px}
.order h3{margin-top:8px}.order .order-code{color:var(--stage-ink)}
.order-status{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;color:var(--stage-ink);background:var(--stage-fill);border:1px solid color-mix(in srgb,var(--stage-mark) 23%,transparent);border-radius:999px;font-weight:750;font-size:.84rem;line-height:1.2;letter-spacing:0}
.order-status .icon{width:15px;height:15px;flex:none}
.order .order-next-status{color:var(--stage-ink);background:var(--stage-fill);border-color:color-mix(in srgb,var(--stage-mark) 30%,transparent)}
.order .order-next-status:hover{background:color-mix(in srgb,var(--stage-fill) 86%,var(--stage-mark))}

.card-items{margin-top:9px;padding:7px 9px;background:var(--soft);border-radius:8px}
.card-items-list{list-style:none;margin:0;padding:0}
.card-items-list li{display:grid;grid-template-columns:minmax(2rem,max-content) minmax(0,1fr);gap:4px;align-items:baseline;padding:3px 0;font-size:.84rem;line-height:1.3}
.card-items-list strong{color:var(--stage-ink);font-variant-numeric:tabular-nums}
.card-items details{margin-top:3px}
.card-items summary{cursor:pointer;width:fit-content;padding-block:4px;color:var(--stage-ink);font-size:.82rem;font-weight:700}
</style>
</head>
